[project]
name = "lodq"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer",
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
    "pydantic>=2",
    "pyvista",
    "streamlit",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lodq"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: полный перебор и калибровка случайных сцен",
]
