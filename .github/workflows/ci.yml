name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Install system packages for offscreen rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1

      - name: Tests
        run: xvfb-run -a uv run pytest -q

      - name: Quick pipeline
        run: xvfb-run -a make all QUICK=1
